name: Crop portraits from Crestview source
on:
  workflow_dispatch:
  push:
    branches: [cursor/author-portrait-hires-9ec0]
    paths:
      - '.github/workflows/crop-portraits-from-source.yml'
      - 'src/data.ts'
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp
      - name: Download and crop Crestview staff photo
        run: |
          mkdir -p public/images
          curl -fsSL -o /tmp/source.jpg "https://crestviewcanton.com/mt-content/uploads/2020/02/dsc08249.jpg"
          # Geometry reverse-engineered to match local Crestview staff crop: 871x871+898+0
          magick /tmp/source.jpg -crop 871x871+898+0 +repage -strip -interlace Plane -quality 92 public/images/author-portrait.jpg
          magick public/images/author-portrait.jpg -resize 640x640 -strip -interlace Plane -quality 90 public/images/author-portrait-640.jpg
          cwebp -q 82 public/images/author-portrait.jpg -o public/images/author-portrait.webp
          ls -la public/images/author-portrait*
          file public/images/author-portrait*
      - name: Commit binaries and fast-forward main
        run: |
          git config user.name "Bear Pixel Media"
          git config user.email "bearpixelmedia@gmail.com"
          git add public/images/author-portrait.jpg public/images/author-portrait.webp public/images/author-portrait-640.jpg
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "$(cat <<'MSG'
          Replace soft author portrait with Crestview staff photo crop

          Use a high-resolution crop from Crestview Baptist’s public studio photo instead of the tiny Amazon back-cover inset / inline base64. Serve JPEG + WebP with srcset/sizes and keep object-fit cover.
          MSG
          )"
          git push origin "HEAD:cursor/author-portrait-hires-9ec0"
          git push origin "HEAD:main"
