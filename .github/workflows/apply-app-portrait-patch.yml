name: Apply author portrait App patch
on:
  push:
    branches: [main]
    paths:
      - 'scripts/app-portrait.patch'
      - '.github/workflows/apply-app-portrait-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: |
          git apply scripts/app-portrait.patch
          rm -f scripts/app-portrait.patch
          rm -f .github/workflows/apply-app-portrait-patch.yml
      - name: Commit App wiring
        run: |
          git config user.name "Bear Pixel Media"
          git config user.email "bearpixelmedia@gmail.com"
          git add src/App.tsx src/App.css
          git add -u scripts .github/workflows || true
          if git diff --cached --quiet; then
            echo "nothing"
            exit 0
          fi
          git commit -m "Wire author portrait picture/srcset and object-fit cover styles"
          git push origin HEAD:main
          git push origin HEAD:cursor/author-portrait-hires-9ec0
